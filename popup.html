<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>YouTube Music Hotkeys</title>
    <style>
      body {
        margin: 0;
        width: 280px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f0f0f;
        color: #f1f1f1;
      }
      .wrap {
        padding: 16px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      p {
        font-size: 12.5px;
        line-height: 1.5;
        color: #b3b3b3;
        margin: 0 0 12px;
      }
      .status {
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
        margin-bottom: 12px;
      }
      .status.trial {
        background: #2a2a12;
        color: #f5d76e;
        border: 1px solid #5a4b0d;
      }
      .status.expired {
        background: #2a1414;
        color: #ff8a8a;
        border: 1px solid #5a1d1d;
      }
      .status.paid {
        background: #10251a;
        color: #6ee7a3;
        border: 1px solid #17512f;
      }
      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: #ff3d5a;
        color: white;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #e6304a;
      }
      ul {
        margin: 12px 0 0;
        padding-left: 18px;
        font-size: 12px;
        color: #b3b3b3;
      }
      li {
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>YouTube Music Hotkeys</h1>
      <p>Global keyboard shortcuts for music.youtube.com.</p>
      <div id="status" class="status">Checking status…</div>
      <button id="action-btn" style="display: none"></button>
      <ul>
        <li>Edit shortcuts at chrome://extensions/shortcuts</li>
      </ul>
    </div>
    <script src="config.js"></script>
    <script src="ExtPay.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
